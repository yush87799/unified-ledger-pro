name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service_dir:
          - 'ULP-frontend'
          - 'ULP-backend/src/services/dashboard'
          - 'ULP-backend/src/services/inventory'
          - 'ULP-backend/src/services/invoicing'
          - 'ULP-backend/src/services/settings'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.service_dir }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ matrix.service_dir }}
        run: npm ci

      - name: Run Lint & Typecheck
        working-directory: ${{ matrix.service_dir }}
        run: npm run lint && npm run typecheck
